# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Release Please"
on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "write"
  packages: "write"
  id-token: "write"
  attestations: "write"
jobs:
  release:
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-please.yaml@c2d153bb417df2c6e65602b595e2204a0704b2a5"
    with:
      language: "python"
      image: "sungather"
      test-command: "docker run --rm --network none \"$IMAGE_REF\" /opt/virtualenv/bin/sungather -h"
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
