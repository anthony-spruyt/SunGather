# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json

name: "Release Please"
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false
env:
  REGISTRY: "ghcr.io"
  IMAGE: "ghcr.io/${{ github.repository_owner }}/sungather"
jobs:
  release-please:
    name: "Release please"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "write"
      pull-requests: "write"
    outputs:
      released: "${{ steps.release.outputs['SunGather--release_created'] }}"
      version: "${{ steps.release.outputs['SunGather--version'] }}"
      tag: "${{ steps.release.outputs['SunGather--tag_name'] }}"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      # GITHUB_TOKEN cannot open pull requests, and its pull requests would not
      # trigger the status checks that pr-rules requires.
      - name: "Mint app token"
        id: "app-token"
        uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1" # v3
        with:
          client-id: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
          private-key: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"

      - name: "Run release-please"
        id: "release"
        uses: "googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7" # v5
        with:
          token: "${{ steps.app-token.outputs.token }}"
          config-file: "release-please-config.json"
          manifest-file: ".release-please-manifest.json"

  release:
    name: "Build, push, and publish"
    needs: "release-please"
    if: "needs.release-please.outputs.released == 'true'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions:
      contents: "write"
      packages: "write"
      id-token: "write"
      attestations: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          ref: "${{ needs.release-please.outputs.tag }}"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069" # v4

      - name: "Login to GHCR"
        uses: "docker/login-action@dbcb813823bdd20940b903addbd779551569679f" # v4
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Docker metadata"
        id: "meta"
        uses: "docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302" # v6
        with:
          images: "${{ env.IMAGE }}"
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - name: "Build and push image"
        id: "push"
        uses: "docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc" # v7
        with:
          context: "."
          file: "SunGather/Dockerfile"
          platforms: "linux/amd64"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
          sbom: true
          provenance: "mode=max"

      - name: "Generate provenance attestation"
        uses: "actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8" # v4
        with:
          subject-name: "${{ env.IMAGE }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true

      # Must stay last: on failure the release stays a draft, so a published
      # release always has an image behind it.
      - name: "Publish release with image details"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.release-please.outputs.tag }}"
          IMAGE_REF: "${{ env.IMAGE }}:${{ needs.release-please.outputs.version }}"
          DIGEST: "${{ steps.push.outputs.digest }}"
          RUN_ID: "${{ github.run_id }}"
          SERVER_URL: "${{ github.server_url }}"
          REPO: "${{ github.repository }}"
        run: |
          BODY=$(gh release view "$TAG" --json body --jq .body)
          {
            printf '%s\n\n' "$BODY"
            printf '## Container Image\n\n'
            printf '```bash\n'
            printf 'docker pull %s\n' "$IMAGE_REF"
            printf '```\n\n'
            # shellcheck disable=SC2016
            printf '**Digest:** `%s`\n\n' "$DIGEST"
            printf '**Platform:** linux/amd64 | **Run:** [#%s](%s/%s/actions/runs/%s)\n' \
              "$RUN_ID" "$SERVER_URL" "$REPO" "$RUN_ID"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false
