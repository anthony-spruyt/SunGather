# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Release Please"
on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}
concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-please.yaml@6e84aee2275994d138c536405bc89314bc648571"
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
  images:
    needs: "release"
    if: "needs.release.outputs.release-created == 'true'"
    permissions:
      contents: "write"
      packages: "write"
      id-token: "write"
      attestations: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-images.yaml@6e84aee2275994d138c536405bc89314bc648571"
    with:
      releases: "${{ needs.release.outputs.releases }}"
      language: "python"
      dockerhub-namespace: "aspruyt"
      image: "sungather"
      test-command: "docker run --rm --network none \"$IMAGE_REF\" /opt/virtualenv/bin/sungather -h"
    secrets:
      DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
