# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Rebuild Release"
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to rebuild; leave empty when the repo has one image"
        required: false
        type: "string"
        default: ""
      version:
        description: "Version to rebuild, without a leading v (e.g., 1.0.0)"
        required: true
        type: "string"
permissions:
  contents: "write"
  packages: "write"
  id-token: "write"
  attestations: "write"
jobs:
  rebuild:
    uses: "anthony-spruyt/repo-operator/.github/workflows/_rebuild-release.yaml@c2d153bb417df2c6e65602b595e2204a0704b2a5"
    with:
      version: "${{ inputs.version }}"
      language: "python"
      image: "sungather"
      test-command: "docker run --rm --network none \"$IMAGE_REF\" /opt/virtualenv/bin/sungather -h"
