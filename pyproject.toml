[tool.pytest.ini_options]
markers = [
    "integration: container integration tests (require Docker and network access)",
]
addopts = "-m 'not integration'"

[tool.ruff]
extend = "ruff-base.toml"
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "BLE001", # upstream catches broadly so one failed read or export never stops the polling loop
    "LOG015", # upstream logs through the root logger that sungather.py configures
    "N801",   # export_<name> classes are looked up by name from config
    "N802",   # camelCase methods are the client's public API; do_GET/do_POST come from BaseHTTPRequestHandler
    "N999",   # upstream package name
]

[tool.ruff.lint.isort]
known-first-party = ["SunGather", "client", "exports", "tests", "version"]
